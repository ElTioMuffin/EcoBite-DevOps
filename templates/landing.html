<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.svg' %}" >
    <title>EcoBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    {% csrf_token %}
    {% include "components/navbar.html" %}
    {% if user.usertype_id == 2 %}
        {% include "components/ownerpanel.html" %}
    {% else %}
            {% include "contents/landing.html" %}
    {% endif %}
</body>
</html>

<script>
const saveUserCordinates = (coords) =>{
    fetch('/location/update',{
        method: "POST",
        headers: {
            'Content-Type':'application/json',
            'X-CSRFToken': '{{csrf_token}}'
        },
        body: JSON.stringify({
            latitude: coords.latitude,
            longitude: coords.longitude,
        })
    })
}

document.addEventListener('DOMContentLoaded',function(){
    if ('geolocation' in navigator){
        navigator.geolocation.getCurrentPosition(
            function(position){
                saveUserCordinates(position.coords)
            },
            function(error){
                console.error(error)
            },
            //Options
            {
                enableHighAccuracy:true,
                timeout: 5000,
                maximumAge: 0
            }
        )
    }if (!navigator.geolocation) {
        showStatus('La geolocalización no está soportada en tu navegador', 'danger');
        return;
            }
});

document.querySelectorAll('#add-cart').forEach(btn => {
    btn.addEventListener('click', function(){
        const product_id = this.dataset.productId

        fetch('{% url "CartAdd" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': this.dataset.csrf
            },
            body: new URLSearchParams({
                'product_id': product_id
            })
        }).then(response => response.json()).then(data => {
            console.log("Response:", data);
            document.getElementById("cart-quantity-desktop").textContent = data.qty;
            document.getElementById("cart-quantity-mobile").textContent = data.qty;
        });
    });
});
</script>
