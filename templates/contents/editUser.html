<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.svg' %}" >
    <title>EcoBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    {% include "components/navbar.html" %}
    <div class="container text-center">
        <div class="alert text-center alert-info display-4 mt-2">Actualizar Perfil</div>
        <div class="col">
            <form method="POST" enctype="multipart/form-data">
                <table class="table container">
                {{ form.non_field_errors }}
                {% csrf_token %}
                {% for field in form %}
                    <div class="form-floating my-2 fieldWrapper">
                    {{ field }}
                    <label for="{{ field.id_for_label }}">{{ field.label_tag}}</label>
                    <div>{{ field.errors }}</div>
                    </div>
                {% endfor %}
                </table>
                <button type="submit" class="btn btn-success" name="user-form">Actualizar Datos</button>
            </form>
        </div>
    </div>
</body>
</html>
