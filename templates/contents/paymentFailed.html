<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card text-center">
                <div class="card-body p-5">
                    <i class="bi bi-x-circle text-danger" style="font-size: 5rem;"></i>
                    <h2 class="mt-3">Pago Rechazado</h2>
                    <p class="lead">No se pudo procesar tu pago</p>
                    
                    <div class="alert alert-danger mt-4">
                        <strong>Número de Orden:</strong> {{ order.id }}<br>
                        <strong>Estado:</strong> {{ order.get_paymentStatus_display }}<br>
                        
                    </div>
                    
                    <div class="badge bg-warning text-dark mb-3">
                        <i class="bi bi-info-circle"></i> Modo Demostración
                    </div>
                    
                    <div>
                        <strong>Escenario:</strong> {{ order.paymentScenario}}
                    </div>
                    
                    <div class="mt-4">
                        <a href="{% url "CartDetails" %}" class="btn btn-outline-secondary">
                            <i class="bi bi-cart"></i> Volver al Carrito
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
