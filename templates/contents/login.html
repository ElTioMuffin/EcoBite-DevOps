{% load static %}
<link rel="stylesheet" href={% static "css/main.css" %}>
<!-- Header -->
<div class="mt-4 row align-items-center justify-content-end" >
    <img class="col-1 me-5" src={% static 'images/main/logo.svg' %} style="width: 100px">
    <p class="col-1 align-self-center">EcoBite</p>
    <div class="col-4 ms-2"></div>
    <div class="col-3 me-2 text-end"></div>
    <div class="col-2"></div>
</div>
<div class="container text-center">
    <div class="alert alert-info display-4 mt-2">Login</div>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <div class="col">
        <form method="POST" enctype="multipart/form-data" action="{% url "auth" %}">
            <table class="table container">
            {{ form.non_field_errors }}
            {% csrf_token %}
            {% for field in form %}
                <div class="form-floating my-2 fieldWrapper">
                {{ field }}
                <label for="{{ field.id_for_label }}">{{ field.label_tag}}</label>
                <div>{{ field.errors }}</div>
                </div>
            {% endfor %}
            </table>
            <button type="submit" class="btn btn-success">Ingresar</button>
        </form>
    </div>
</div>
